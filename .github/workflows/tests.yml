name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened,reopened,synchronize]
  push:
    branches:
      - master

jobs:
  Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `sv/testing` installs every project it generates with pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test

  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Without `--fix`, which `npm run lint` passes: a finding fails the job.
      - name: Lint
        run: npx eslint .
